name: POC - Build & Artifact

on:
  push:
    branches: [main, feature/add-artifact]
  workflow_dispatch:
    inputs:
      custom_message:
        description: 'Mensaje personalizado para el artefacto'
        required: false
        default: 'Ejecutado manualmente'

permissions:
  contents: read

jobs:
  build:
    name: Build Artifact
    runs-on: ubuntu-latest

    env:
      POC_MESSAGE: ${{ inputs.custom_message || secrets.POC_MESSAGE || 'Hola desde GitHub Actions!' }}
      OUT_DIR: dist

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug - Mostrar variables de entorno
        run: |
          echo "##[debug]=================================================="
          echo "##[debug] Variables de GitHub Actions"
          echo "##[debug]=================================================="
          echo "##[debug] GITHUB_SHA: $GITHUB_SHA"
          echo "##[debug] GITHUB_REF: $GITHUB_REF"
          echo "##[debug] GITHUB_RUN_NUMBER: $GITHUB_RUN_NUMBER"
          echo "##[debug] GITHUB_ACTOR: $GITHUB_ACTOR"
          echo "##[debug] GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
          echo "##[debug]--------------------------------------------------"
          echo "##[debug] Variables personalizadas"
          echo "##[debug]--------------------------------------------------"
          echo "##[debug] POC_MESSAGE: $POC_MESSAGE"
          echo "##[debug] OUT_DIR: $OUT_DIR"
          echo "##[debug]=================================================="

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generar artefacto
        run: python scripts/generate.py

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
